<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIXO AI — CRM</title><style>:root{--bg:#050605;--panel:#0b0e0b;--line:#202820;--text:#f4f7f2;--muted:#9da89a;--lime:#b7ff00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial}.wrap{width:min(1100px,calc(100% - 30px));margin:40px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.logo{font-size:28px;font-weight:950}.logo i{color:var(--lime);font-style:normal}.muted{color:var(--muted)}button,input{font:inherit}.bar{display:flex;gap:10px;margin-bottom:20px}.bar input{flex:1;background:#080a08;color:var(--text);border:1px solid #303830;border-radius:12px;padding:13px}.bar button{background:var(--lime);border:0;border-radius:12px;padding:0 18px;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat,.lead{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{display:block;font-size:30px;margin-top:8px}.lead{margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px}.lead h3{margin:0 0 7px}.lead p{margin:4px 0;color:var(--muted);font-size:13px}.badge{padding:7px 10px;border:1px solid #3b4935;border-radius:999px;color:var(--lime);height:max-content;font-size:11px;font-weight:900}.error{color:#ff8b8b}@media(max-width:650px){.stats{grid-template-columns:1fr}.lead{grid-template-columns:1fr}.bar{flex-direction:column}.bar button{padding:12px}}</style></head><body><main class="wrap"><div class="top"><div><div class="logo">TIXO<span> AI</span><i> / CRM</i></div><div class="muted">Лиды с сайта</div></div><a class="muted" href="/">← На сайт</a></div><div class="bar"><input id="key" type="password" placeholder="ADMIN_KEY"><button id="load">Загрузить лиды</button></div><div id="msg" class="muted"></div><div class="stats"><div class="stat"><span class="muted">Всего лидов</span><b id="total">—</b></div><div class="stat"><span class="muted">Новые</span><b id="fresh">—</b></div><div class="stat"><span class="muted">Последний</span><b id="last">—</b></div></div><div id="list"></div></main><script>const $=id=>document.getElementById(id);$('load').onclick=async()=>{const key=$('key').value.trim();if(!key)return $('msg').textContent='Введи ADMIN_KEY';$('msg').textContent='Загрузка…';try{const r=await fetch('/api/leads',{headers:{'x-admin-key':key}});const j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка');const d=j.leads||[];$('total').textContent=d.length;$('fresh').textContent=d.filter(x=>x.status==='new').length;$('last').textContent=d[0]?new Date(d[0].created_at).toLocaleString('ru-RU'):'—';$('list').innerHTML=d.map(x=>`<article class="lead"><div><h3>${esc(x.niche)} — ${esc(x.goal)}</h3><p>Формат: ${esc(x.format)} · Ролики: ${esc(x.quantity)} · Бюджет: ${esc(x.budget)}</p><p>${esc(x.brief)}</p><p>${new Date(x.created_at).toLocaleString('ru-RU')}</p></div><div><select class="status" data-id="${esc(x.id)}"><option value="new" ${x.status==='new'?'selected':''}>new</option><option value="contacted" ${x.status==='contacted'?'selected':''}>contacted</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>in_progress</option><option value="done" ${x.status==='done'?'selected':''}>done</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>cancelled</option></select></div></article>`).join('');$('msg').textContent='CRM обновлена';}catch(e){$('msg').className='error';$('msg').textContent=e.message}};function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}document.addEventListener('change',async e=>{if(!e.target.classList.contains('status'))return;const key=$('key').value.trim();const r=await fetch('/api/leads',{method:'PATCH',headers:{'x-admin-key':key,'Content-Type':'application/json'},body:JSON.stringify({id:e.target.dataset.id,status:e.target.value})});if(!r.ok){const j=await r.json().catch(()=>({}));$('msg').textContent=j.error||'Не удалось изменить статус';}else $('msg').textContent='Статус сохранён';});</script></body></html>
