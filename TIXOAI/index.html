<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>TIXO AI — AI-контент, визуалы и short-form</title>
  <meta
    name="description"
    content="TIXO AI — создание AI-визуалов, short-form контента и контент-систем для бизнеса."
  >

  <style>
    :root {
      --bg: #050505;
      --bg2: #090b08;
      --card: #0d100c;
      --line: rgba(186, 255, 0, .15);
      --green: #baff00;
      --green2: #8fd900;
      --text: #f4f6ef;
      --muted: #858b80;
      --radius: 24px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 80% 10%, rgba(186,255,0,.09), transparent 25%),
        radial-gradient(circle at 10% 40%, rgba(186,255,0,.045), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      background-image:
        linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 18px 0;
      background: rgba(5,5,5,.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .logo-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #050505;
      background: var(--green);
      box-shadow: 0 0 30px rgba(186,255,0,.3);
      font-size: 15px;
      font-weight: 1000;
    }

    nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    nav a {
      color: #a5aaa0;
      font-size: 14px;
      transition: .2s ease;
    }

    nav a:hover {
      color: var(--green);
    }

    .nav-button {
      padding: 11px 17px;
      border: 1px solid var(--green);
      border-radius: 999px;
      color: var(--green);
      font-weight: 800;
      transition: .2s ease;
    }

    .nav-button:hover {
      background: var(--green);
      color: #050505;
      box-shadow: 0 0 30px rgba(186,255,0,.25);
    }

    /* HERO */

    .hero {
      min-height: 900px;
      padding: 170px 0 100px;
      display: grid;
      align-items: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(186,255,0,.035);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 25px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    h1 {
      max-width: 750px;
      font-size: clamp(55px, 7.2vw, 100px);
      line-height: .88;
      letter-spacing: -.075em;
      font-weight: 950;
    }

    h1 span {
      color: var(--green);
    }

    .hero-text {
      max-width: 590px;
      margin-top: 28px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: 13px;
      flex-wrap: wrap;
      margin-top: 35px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.035);
      color: white;
      font-weight: 800;
      transition: .22s ease;
      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-3px);
      border-color: rgba(186,255,0,.5);
      background: rgba(186,255,0,.06);
    }

    .button-primary {
      background: var(--green);
      border-color: var(--green);
      color: #050505;
      box-shadow: 0 0 45px rgba(186,255,0,.13);
    }

    .button-primary:hover {
      background: #c8ff33;
      box-shadow: 0 0 55px rgba(186,255,0,.25);
    }

    /* HERO VISUAL */

    .hero-visual {
      position: relative;
      min-height: 500px;
      border: 1px solid var(--line);
      border-radius: 30px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(186,255,0,.08), transparent 45%),
        #080a07;
