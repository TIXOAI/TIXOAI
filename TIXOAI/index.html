<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>TIXO AI — AI-контент, визуалы и short-form</title>
  <meta
    name="description"
    content="TIXO AI — создание AI-визуалов, short-form контента и контент-систем для бизнеса."
  >

  <style>
    :root {
      --bg: #050505;
      --bg2: #090b08;
      --card: #0d100c;
      --line: rgba(186,255,0,.15);
      --green: #baff00;
      --text: #f4f6ef;
      --muted: #858b80;
      --radius: 24px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(186,255,0,.09),
          transparent 25%
        ),
        radial-gradient(
          circle at 10% 40%,
          rgba(186,255,0,.045),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;

      background-image:
        linear-gradient(
          rgba(255,255,255,.5) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.5) 1px,
          transparent 1px
        );

      background-size: 60px 60px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );

      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .container {
      width: min(
        var(--max),
        calc(100% - 40px)
      );

      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;

      padding: 18px 0;

      background: rgba(5,5,5,.72);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom:
        1px solid rgba(255,255,255,.05);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .logo-mark {
      width: 31px;
      height: 31px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      color: #050505;
      background: var(--green);

      box-shadow:
        0 0 30px rgba(186,255,0,.3);

      font-size: 15px;
      font-weight: 1000;
    }

    nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    nav a {
      color: #a5aaa0;
      font-size: 14px;
      transition: .2s ease;
    }

    nav a:hover {
      color: var(--green);
    }

    .nav-button {
      padding: 11px 17px;

      border:
        1px solid var(--green);

      border-radius: 999px;

      color: var(--green);
      font-weight: 800;

      transition: .2s ease;
    }

    .nav-button:hover {
      background: var(--green);
      color: #050505;

      box-shadow:
        0 0 30px rgba(186,255,0,.25);
    }

    /* HERO */

    .hero {
      min-height: 900px;

      padding:
        170px 0
        100px;

      display: grid;
      align-items: center;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        1.05fr .95fr;

      gap: 70px;

      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 8px 13px;

      border:
        1px solid var(--line);

      border-radius: 999px;

      background:
        rgba(186,255,0,.035);

      color: var(--green);

      font-size: 12px;
      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .08em;

      margin-bottom: 25px;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 14px var(--green);
    }

    h1 {
      max-width: 750px;

      font-size:
        clamp(
          55px,
          7.2vw,
          100px
        );

      line-height: .88;

      letter-spacing: -.075em;

      font-weight: 950;
    }

    h1 span {
      color: var(--green);
    }

    .hero-text {
      max-width: 590px;

      margin-top: 28px;

      color: var(--muted);

      font-size: 18px;

      line-height: 1.7;
    }

    .hero-actions {
      display: flex;

      gap: 13px;

      flex-wrap: wrap;

      margin-top: 35px;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 52px;

      padding:
        0 22px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 14px;

      background:
        rgba(255,255,255,.035);

      color: white;

      font-weight: 800;

      transition: .22s ease;

      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-3px);

      border-color:
        rgba(186,255,0,.5);

      background:
        rgba(186,255,0,.06);
    }

    .button-primary {
      background: var(--green);

      border-color: var(--green);

      color: #050505;

      box-shadow:
        0 0 45px
        rgba(186,255,0,.13);
    }

    .button-primary:hover {
      background: #c8ff33;

      box-shadow:
        0 0 55px
        rgba(186,255,0,.25);
    }

    /* HERO VISUAL */

    .hero-visual {
      position: relative;

      min-height: 500px;

      border:
        1px solid var(--line);

      border-radius: 30px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(186,255,0,.08),
          transparent 45%
        ),
        #080a07;

      box-shadow:
        inset 0 0 80px
        rgba(186,255,0,.035),

        0 30px 100px
        rgba(0,0,0,.35);
    }

    .hero-visual::before {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      border-radius: 50%;

      background:
        rgba(186,255,0,.16);

      filter: blur(90px);

      top: 70px;
      right: 40px;

      animation:
        glow 5s
        ease-in-out
        infinite
        alternate;
    }

    @keyframes glow {
      from {
        transform:
          translate(0,0)
          scale(.9);

        opacity: .45;
      }

      to {
        transform:
          translate(-50px,30px)
          scale(1.15);

        opacity: .8;
      }
    }

    .city {
      position: absolute;

      inset:
        70px
        30px
        0;

      display: flex;

      align-items: end;
      justify-content: center;

      gap: 7px;

      transform:
        perspective(500px)
        rotateX(7deg);
    }

    .building {
      position: relative;

      width: 12%;
      min-width: 32px;

      border:
        1px solid
        rgba(186,255,0,.13);

      background:
        repeating-linear-gradient(
          90deg,
          rgba(186,255,0,.07) 0 3px,
          transparent 3px 12px
        ),
        linear-gradient(
          to top,
          #0b1207,
          #121a0d
        );

      box-shadow:
        0 0 30px
        rgba(186,255,0,.025);
    }

    .building:nth-child(1) {
      height: 37%;
    }

    .building:nth-child(2) {
      height: 53%;
    }

    .building:nth-child(3) {
      height: 75%;
    }

    .building:nth-child(4) {
      height: 45%;
    }

    .building:nth-child(5) {
      height: 91%;
    }

    .building:nth-child(6) {
      height: 62%;
    }

    .building:nth-child(7) {
      height: 82%;
    }

    .building:nth-child(8) {
      height: 48%;
    }

    .building::after {
      content: "";

      position: absolute;

      inset: 10px;

      background:
        repeating-linear-gradient(
          180deg,
          rgba(186,255,0,.4) 0 2px,
          transparent 2px 17px
        );

      opacity: .18;
    }

    .visual-label {
      position: absolute;

      left: 25px;
      top: 25px;

      z-index: 2;

      color:
        rgba(255,255,255,.5);

      font-size: 11px;

      letter-spacing: .15em;

      text-transform: uppercase;
    }

    .visual-number {
      position: absolute;

      right: 25px;
      top: 22px;

      z-index: 2;

      color: var(--green);

      font-size: 11px;

      font-weight: 900;
    }

    /* SECTIONS */

    section {
      padding: 110px 0;
    }

    .section-head {
      display: flex;

      justify-content:
        space-between;

      align-items: end;

      gap: 30px;

      margin-bottom: 45px;
    }

    .section-kicker {
      color: var(--green);

      text-transform:
        uppercase;

      letter-spacing: .14em;

      font-size: 11px;

      font-weight: 900;

      margin-bottom: 12px;
    }

    h2 {
      font-size:
        clamp(
          38px,
          5vw,
          65px
        );

      line-height: .95;

      letter-spacing: -.06em;
    }

    .section-description {
      max-width: 420px;

      color: var(--muted);

      font-size: 15px;
    }

    /* SERVICES */

    .services,
    .works,
    .prices {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 15px;
    }

    .card {
      position: relative;

      min-height: 320px;

      padding: 28px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: var(--radius);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.01)
        );

      overflow: hidden;

      transition: .3s ease;
    }

    .card:hover {
      transform:
        translateY(-7px);

      border-color:
        rgba(186,255,0,.35);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);
    }

    .card::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      border-radius: 50%;

      background:
        rgba(186,255,0,.06);

      filter: blur(50px);

      right: -70px;
      bottom: -70px;
    }

    .card-number {
      color: var(--green);

      font-size: 12px;

      font-weight: 900;

      margin-bottom: 75px;
    }

    .card h3 {
      font-size: 26px;

      letter-spacing: -.035em;

      margin-bottom: 12px;
    }

    .card p {
      color: var(--muted);

      font-size: 14px;

      line-height: 1.65;
    }

    /* WORK */

    .work {
      min-height: 410px;

      position: relative;

      overflow: hidden;

      border-radius: var(--radius);

      border:
        1px solid
        rgba(255,255,255,.08);

      background: #0b0d0a;
    }

    .work-bg {
      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at 70% 25%,
          rgba(186,255,0,.45),
          transparent 20%
        ),
        linear-gradient(
          145deg,
          #18210e,
          #070807 55%
        );
    }

    .work:nth-child(2) .work-bg {
      background:
        radial-gradient(
          circle at 40% 30%,
          rgba(255,255,255,.18),
          transparent 15%
        ),
        linear-gradient(
          145deg,
          #1b1d19,
          #080908 60%
        );
    }

    .work:nth-child(3) .work-bg {
      background:
        radial-gradient(
          circle at 70% 65%,
          rgba(186,255,0,.3),
          transparent 25%
        ),
        linear-gradient(
          145deg,
          #0e150b,
          #060706 65%
        );
    }

    .work-grid {
      position: absolute;

      inset: 0;

      background-image:
        linear-gradient(
          rgba(186,255,0,.07) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(186,255,0,.07) 1px,
          transparent 1px
        );

      background-size: 35px 35px;

      opacity: .4;
    }

    .work-info {
      position: absolute;

      left: 22px;
      right: 22px;
      bottom: 22px;

      padding: 18px;

      border-radius: 17px;

      background:
        rgba(5,5,5,.7);

      border:
        1px solid
        rgba(255,255,255,.1);

      backdrop-filter:
        blur(15px);
    }

    .work-info small {
      color: var(--green);

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: .12em;

      font-weight: 900;
    }

    .work-info h3 {
      margin-top: 5px;

      font-size: 21px;
    }

    /* PROCESS */

    .process {
      display: grid;

      grid-template-columns:
        repeat(4,1fr);

      gap: 12px;
    }

    .process-item {
      padding: 25px;

      border-top:
        1px solid
        rgba(186,255,0,.35);
    }

    .process-item span {
      color: var(--green);

      font-weight: 900;

      font-size: 13px;
    }

    .process-item h3 {
      margin:
        30px 0
        10px;

      font-size: 20px;
    }

    .process-item p {
      color: var(--muted);

      font-size: 13px;
    }

    /* PRICES */

    .price {
      padding: 32px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius: var(--radius);

      background: #0a0c09;
    }

    .price.featured {
      border-color:
        rgba(186,255,0,.5);

      box-shadow:
        0 0 70px
        rgba(186,255,0,.06);
    }

    .price-label {
      color: var(--green);

      font-size: 11px;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: .12em;
    }

    .price h3 {
      margin-top: 18px;

      font-size: 28px;
    }

    .price-value {
      margin: 20px 0;

      font-size: 38px;

      font-weight: 900;

      letter-spacing: -.05em;
    }

    .price ul {
      list-style: none;

      display: grid;

      gap: 11px;

      margin: 25px 0;
    }

    .price li {
      color: #b4b9b0;

      font-size: 13px;
    }

    .price li::before {
      content: "✓";

      color: var(--green);

      margin-right: 9px;

      font-weight: 900;
    }

    .price .button {
      width: 100%;
    }

    /* FAQ */

    .faq {
      max-width: 850px;
    }

    .faq-item {
      border-top:
        1px solid
        rgba(255,255,255,.09);
    }

    .faq-item:last-child {
      border-bottom:
        1px solid
        rgba(255,255,255,.09);
    }

    .faq-question {
      width: 100%;

      padding: 25px 0;

      background: none;

      border: 0;

      color: white;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      text-align: left;

      cursor: pointer;

      font-weight: 800;

      font-size: 16px;
    }

    .faq-plus {
      color: var(--green);

      font-size: 24px;

      transition: .2s ease;
    }

    .faq-answer {
      max-height: 0;

      overflow: hidden;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;

      transition:
        max-height .3s ease;
    }

    .faq-answer-inner {
      padding: 0 0 25px;
    }

    .faq-item.active
    .faq-answer {
      max-height: 200px;
    }

    .faq-item.active
    .faq-plus {
      transform: rotate(45deg);
    }

    /* CONTACT */

    .contact-box {
      position: relative;

      overflow: hidden;

      padding: 55px;

      border:
        1px solid
        rgba(186,255,0,.25);

      border-radius: 30px;

      background:
        radial-gradient(
          circle at 85% 50%,
          rgba(186,255,0,.13),
          transparent 30%
        ),
        #090b08;
    }

    .contact-box h2 {
      max-width: 650px;
    }

    .contact-box p {
      max-width: 550px;

      margin:
        20px 0
        30px;

      color: var(--muted);
    }

    .contact-form {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      max-width: 750px;
    }

    .field {
      width: 100%;

      min-height: 54px;

      padding: 0 17px;

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius: 13px;

      outline: none;

      color: white;

      background:
        rgba(255,255,255,.035);
    }

    textarea.field {
      padding-top: 15px;

      min-height: 130px;

      resize: vertical;

      grid-column: 1 / -1;
    }

    .field:focus {
      border-color:
        rgba(186,255,0,.5);

      box-shadow:
        0 0 0 3px
        rgba(186,255,0,.05);
    }

    .contact-form .button {
      border: 0;
    }

    #formStatus {
      grid-column: 1 / -1;

      color: var(--green);

      font-size: 13px;

      min-height: 20px;
    }

    /* FOOTER */

    footer {
      padding: 45px 0;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color: #686d65;

      font-size: 12px;
    }

    .footer-inner {
      display: flex;

      justify-content:
        space-between;

      gap: 20px;
    }

    footer a {
      color: var(--green);
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;
      }

      .hero-visual {
        min-height: 430px;
      }

      .services,
      .works,
      .prices {
        grid-template-columns: 1fr;
      }

      .process {
        grid-template-columns:
          1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .container {
        width:
          min(
            100% - 26px,
            var(--max)
          );
      }

      header {
        padding: 13px 0;
      }

      nav {
        display: none;
      }

      .nav-button {
        padding: 9px 13px;

        font-size: 12px;
      }

      .hero {
        padding:
          125px 0
          65px;
      }

      h1 {
        font-size:
          clamp(
            52px,
            16vw,
            78px
          );
      }

      .hero-text {
        font-size: 15px;
      }

      .hero-visual {
        min-height: 340px;
      }

      section {
        padding: 75px 0;
      }

      .section-head {
        display: block;
      }

      .section-description {
        margin-top: 18px;
      }

      .process {
        grid-template-columns: 1fr;
      }

      .contact-box {
        padding: 30px 20px;
      }

      .contact-form {
        grid-template-columns: 1fr;
      }

      textarea.field,
      #formStatus {
        grid-column: auto;
      }

      .footer-inner {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="#top" class="logo">
      <span class="logo-mark">T</span>
      TIXO AI
    </a>

    <nav aria-label="Основная навигация">
      <a href="#services">Услуги</a>
      <a href="#work">Работы</a>
      <a href="#process">Процесс</a>
      <a href="#prices">Цены</a>
      <a href="#faq">FAQ</a>
    </nav>

    <a
      class="nav-button"
      href="#contact"
    >
      Обсудить проект
    </a>

  </div>
</header>


<main id="top">

  <!-- HERO -->

  <section class="hero">

    <div class="container hero-grid">

      <div>

        <div class="eyebrow">
          <span class="dot"></span>
          AI CREATIVE STUDIO
        </div>

        <h1>
          Контент,<br>
          который<br>
          <span>цепляет.</span>
        </h1>

        <p class="hero-text">
          TIXO AI создаёт визуалы, short-form
          и контент-системы для бизнеса
          с использованием современных
          AI-инструментов.
        </p>

        <div class="hero-actions">

          <a
            href="#contact"
            class="button button-primary"
          >
            Запустить проект →
          </a>

          <a
            href="#work"
            class="button"
          >
