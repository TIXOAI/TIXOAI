<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050605">
<meta name="description" content="TIXO AI — AI-визуалы, short-form и контент-системы для бизнеса.">
<title>TIXO AI — Контент для бизнеса</title>

<style>
:root{
  --bg:#050605;
  --card:#0a0d0a;
  --card2:#101510;
  --green:#baff00;
  --text:#f4f7ef;
  --muted:#929b90;
  --line:rgba(186,255,0,.2);
  --whiteLine:rgba(255,255,255,.09);
  --radius:24px;
  --max:1180px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  scroll-padding-top:85px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body:before,
body:after{
  content:"";
  position:fixed;
  pointer-events:none;
  z-index:-1;
  border-radius:50%;
  filter:blur(130px);
}

body:before{
  width:520px;
  height:520px;
  right:-250px;
  top:80px;
  background:var(--green);
  opacity:.055;
}

body:after{
  width:400px;
  height:400px;
  left:-250px;
  bottom:5%;
  background:var(--green);
  opacity:.025;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  width:min(calc(100% - 32px),var(--max));
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,6,5,.78);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--whiteLine);
}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:27px;
  font-weight:950;
  letter-spacing:-2px;
  white-space:nowrap;
}

.logo b{
  color:var(--green);
}

nav{
  display:flex;
  align-items:center;
  gap:28px;
  color:#9ba39a;
  font-size:14px;
}

nav a{
  transition:.2s;
}

nav a:hover{
  color:var(--green);
}

.navcta{
  white-space:nowrap;
}

/* =========================
   BUTTONS
========================= */

.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-height:48px;
  padding:13px 20px;
  border:1px solid var(--green);
  border-radius:13px;
  background:var(--green);
  color:#071000;
  font-weight:850;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    color .2s ease;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 38px rgba(186,255,0,.16);
}

.btn:active{
  transform:translateY(0);
}

.btn.dark{
  background:transparent;
  color:var(--text);
  border-color:var(--whiteLine);
}

.btn.dark:hover{
  color:var(--green);
  border-color:var(--green);
  box-shadow:none;
}

.btn:disabled{
  opacity:.65;
  cursor:wait;
  transform:none;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:calc(100vh - 72px);
  min-height:700px;
  display:flex;
  align-items:center;
  padding:85px 0;
}

.heroGrid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:65px;
  align-items:center;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:100px;
  color:var(--green);
  background:rgba(186,255,0,.025);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.1em;
}

.dot{
  width:7px;
  height:7px;
  flex:none;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 15px var(--green);
}

h1{
  max-width:850px;
  margin:25px 0;
  font-size:clamp(50px,7vw,94px);
  line-height:.91;
  letter-spacing:-6px;
}

.green{
  color:var(--green);
}

.hero p{
  max-width:650px;
  margin:0;
  color:#a5ada2;
  font-size:18px;
  line-height:1.65;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

/* =========================
   HERO VISUAL
========================= */

.visual{
  position:relative;
  height:470px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    radial-gradient(
      circle at 70% 25%,
      rgba(186,255,0,.28),
      transparent 22%
    ),
    radial-gradient(
      circle at 25% 80%,
      rgba(186,255,0,.08),
      transparent 25%
    ),
    linear-gradient(145deg,#131a13,#030403 65%);
  box-shadow:
    0 35px 100px rgba(0,0,0,.5),
    inset 0 0 70px rgba(186,255,0,.025);
  transform:rotate(1deg);
}

.visual:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 49.5%,
      rgba(186,255,0,.08) 50%,
      transparent 50.5%
    ),
    linear-gradient(
      0deg,
      transparent 49.5%,
      rgba(186,255,0,.06) 50%,
      transparent 50.5%
    );
  background-size:90px 90px;
  opacity:.5;
}

.visualText{
  position:absolute;
  left:28px;
  top:28px;
  z-index:4;
}

.visualText small{
  color:var(--green);
  font-weight:800;
}

.visualText strong{
  display:block;
  margin-top:8px;
  font-size:35px;
  letter-spacing:-2px;
}

.buildings{
  position:absolute;
  inset:0;
  display:flex;
  align-items:end;
  gap:7px;
  padding:35px;
}

.building{
  position:relative;
  flex:1;
  min-height:40%;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(186,255,0,.2) 0 2px,
      transparent 2px 22px
    ),
    linear-gradient(90deg,#101610,#202a20);
  border:1px solid rgba(186,255,0,.12);
  box-shadow:0 0 30px rgba(186,255,0,.06);
}

.building:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 12px,
      rgba(186,255,0,.07) 12px 14px
    );
}

.building:nth-child(2){height:72%}
.building:nth-child(3){height:92%}
.building:nth-child(4){height:65%}
.building:nth-child(5){height:82%}

/* =========================
   SECTIONS
========================= */

section{
  padding:105px 0;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  margin-bottom:40px;
}

.kicker{
  color:var(--green);
  font-size:11px;
  font-weight:900;
  letter-spacing:.15em;
  text-transform:uppercase;
}

h2{
  margin:10px 0 0;
  font-size:clamp(38px,5vw,67px);
  line-height:.95;
  letter-spacing:-4px;
}

.heading p{
  max-width:400px;
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

/* =========================
   SERVICES
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.card{
  position:relative;
  min-height:280px;
  padding:26
