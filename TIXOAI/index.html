<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <meta
    name="description"
    content="TIXO AI — AI-контент, визуалы, short-form и контент-системы для бизнеса."
  >

  <title>
    TIXO AI — AI-контент, визуалы и short-form
  </title>

  <style>

    :root {
      --bg: #050505;
      --bg-soft: #080a07;
      --card: #0c0f0b;
      --card-2: #10130f;

      --green: #baff00;
      --green-soft: rgba(186,255,0,.10);
      --green-line: rgba(186,255,0,.20);

      --white: #f4f7ef;
      --text: #dfe5d8;
      --muted: #858c81;
      --muted-2: #5e655b;

      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.13);

      --radius: 24px;
      --radius-small: 15px;

      --max: 1240px;
    }


    /* =========================
       RESET
    ========================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      min-height: 100vh;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(186,255,0,.08),
          transparent 25%
        ),
        radial-gradient(
          circle at 0% 35%,
          rgba(186,255,0,.045),
          transparent 25%
        ),
        var(--bg);

      color: var(--white);

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      line-height: 1.5;
    }


    body::before {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: -1;

      opacity: .025;

      background-image:
        linear-gradient(
          rgba(255,255,255,.8) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.8) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }


    ::selection {
      color: #050505;
      background: var(--green);
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    img {
      max-width: 100%;
      display: block;
    }


    .container {
      width:
        min(
          var(--max),
          calc(100% - 40px)
        );

      margin: 0 auto;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      border-bottom:
        1px solid
        rgba(255,255,255,.055);

      background:
        rgba(5,5,5,.72);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }


    .nav {
      height: 76px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 20px;
    }


    .brand {
      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 20px;

      font-weight: 950;

      letter-spacing: -.05em;
    }


    .brand-mark {
      width: 34px;
      height: 34px;

      display: grid;

      place-items: center;

      border-radius: 10px;

      background: var(--green);

      color: #050505;

      box-shadow:
        0 0 35px
        rgba(186,255,0,.28);

      font-size: 15px;

      font-weight: 1000;
    }


    .nav-links {
      display: flex;

      align-items: center;

      gap: 25px;
    }


    .nav-links a {
      color: #a6ada1;

      font-size: 13px;

      transition: .2s ease;
    }


    .nav-links a:hover {
      color: var(--green);
    }


    .header-cta {
      padding:
        11px 17px;

      border:
        1px solid
        var(--green);

      border-radius: 999px;

      color: var(--green);

      font-size: 12px;

      font-weight: 850;

      transition: .2s ease;
    }


    .header-cta:hover {
      background: var(--green);

      color: #050505;

      box-shadow:
        0 0 30px
        rgba(186,255,0,.2);
    }


    /* =========================
       COMMON
    ========================= */

    .section {
      padding: 125px 0;
    }


    .section-top {
      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap: 40px;

      margin-bottom: 50px;
    }


    .section-number {
      margin-bottom: 13px;

      color: var(--green);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: .18em;

      text-transform: uppercase;
    }


    .section-title {
      font-size:
        clamp(
          42px,
          5.7vw,
          76px
        );

      line-height: .9;

      letter-spacing: -.065em;

      font-weight: 950;
    }


    .section-copy {
      max-width: 430px;

      color: var(--muted);

      font-size: 15px;

      line-height: 1.7;
    }


    .button {
      min-height: 52px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      padding:
        0 21px;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 14px;

      background:
        rgba(255,255,255,.035);

      color: white;

      font-size: 13px;

      font-weight: 850;

      transition:
        transform .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
    }


    .button:hover {
      transform:
        translateY(-3px);

      border-color:
        rgba(186,255,0,.42);

      background:
        rgba(186,255,0,.06);
    }


    .button-primary {
      background: var(--green);

      border-color:
        var(--green);

      color: #050505;

      box-shadow:
        0 0 45px
        rgba(186,255,0,.12);
    }


    .button-primary:hover {
      background: #c8ff30;

      box-shadow:
        0 0 55px
        rgba(186,255,0,.24);
    }


    .tag {
      display: inline-flex;

      padding:
        6px 10px;

      border:
        1px solid
        var(--green-line);

      border-radius: 999px;

      background:
        rgba(186,255,0,.035);

      color: var(--green);

      font-size: 9px;

      font-weight: 900;

      letter-spacing: .11em;

      text-transform: uppercase;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 900px;

      padding:
        175px 0
        90px;

      display: flex;

      align-items: center;
    }


    .hero-grid {
      display: grid;

      grid-template-columns:
        1fr
        .92fr;

      gap: 75px;

      align-items: center;
    }


    .hero-kicker {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      margin-bottom: 27px;

      padding:
        8px 12px;

      border:
        1px solid
        var(--green-line);

      border-radius: 999px;

      background:
        rgba(186,255,0,.035);

      color: var(--green);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: .13em;

      text-transform: uppercase;
    }


    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 13px
        var(--green);

      animation:
        pulse 1.7s
        infinite;
    }


    @keyframes pulse {
      0%,
      100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }
    }


    .hero h1 {
      max-width: 800px;

      font-size:
        clamp(
          57px,
          8vw,
          108px
        );

      line-height: .84;

      letter-spacing: -.085em;

      font-weight: 950;
    }


    .hero h1 span {
      color: var(--green);
    }


    .hero-description {
      max-width: 610px;

      margin-top: 30px;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.7;
    }


    .hero-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 35px;
    }


    .hero-note {
      margin-top: 18px;

      color: var(--muted-2);

      font-size: 11px;
    }


    /* HERO VISUAL */

    .hero-screen {
      position: relative;

      min-height: 560px;

      overflow: hidden;

      border:
        1px solid
        var(--green-line);

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(186,255,0,.08),
          transparent 45%
        ),
        #080a07;

      box-shadow:
        inset 0 0 100px
        rgba(186,255,0,.035),

        0 40px 100px
        rgba(0,0,0,.38);
    }


    .hero-screen::before {
      content: "";

      position: absolute
